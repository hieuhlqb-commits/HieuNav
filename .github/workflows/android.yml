name: Build HieuNav APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      HIEUNAV_KEYSTORE_BASE64: ${{ secrets.HIEUNAV_KEYSTORE_BASE64 }}
      HIEUNAV_STORE_PASSWORD: ${{ secrets.HIEUNAV_STORE_PASSWORD }}
      HIEUNAV_KEY_ALIAS: ${{ secrets.HIEUNAV_KEY_ALIAS }}
      HIEUNAV_KEY_PASSWORD: ${{ secrets.HIEUNAV_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare and validate persistent signing key
        shell: bash
        run: |
          set -euo pipefail
          for name in HIEUNAV_KEYSTORE_BASE64 HIEUNAV_STORE_PASSWORD HIEUNAV_KEY_ALIAS HIEUNAV_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

          KEYSTORE="$RUNNER_TEMP/hieunav-release.keystore"
          if ! printf '%s' "$HIEUNAV_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"; then
            echo "::error::HIEUNAV_KEYSTORE_BASE64 is not valid Base64. Re-copy the Base64 output from Termux."
            exit 1
          fi
          if [ ! -s "$KEYSTORE" ]; then
            echo "::error::Decoded keystore is empty. Check HIEUNAV_KEYSTORE_BASE64."
            exit 1
          fi

          if ! keytool -list -keystore "$KEYSTORE" -storepass "$HIEUNAV_STORE_PASSWORD" -alias "$HIEUNAV_KEY_ALIAS" > "$RUNNER_TEMP/key-check.txt" 2>&1; then
            echo "::error::Keystore validation failed. Check HIEUNAV_STORE_PASSWORD and HIEUNAV_KEY_ALIAS. Details:"
            cat "$RUNNER_TEMP/key-check.txt"
            exit 1
          fi

          echo "HIEUNAV_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Persistent HieuNav signing key is valid."

      - name: Build signed APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HieuNav-signed-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
