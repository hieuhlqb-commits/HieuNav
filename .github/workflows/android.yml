name: Build HieuNav APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      HIEUNAV_KEYSTORE_BASE64: ${{ secrets.HIEUNAV_KEYSTORE_BASE64 }}
      HIEUNAV_STORE_PASSWORD: ${{ secrets.HIEUNAV_STORE_PASSWORD }}
      HIEUNAV_KEY_ALIAS: ${{ secrets.HIEUNAV_KEY_ALIAS }}
      HIEUNAV_KEY_PASSWORD: ${{ secrets.HIEUNAV_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare persistent signing key
        shell: bash
        run: |
          if [ -z "$HIEUNAV_KEYSTORE_BASE64" ] || [ -z "$HIEUNAV_STORE_PASSWORD" ] || [ -z "$HIEUNAV_KEY_ALIAS" ] || [ -z "$HIEUNAV_KEY_PASSWORD" ]; then
            echo "::error::Missing GitHub Actions secrets for persistent APK signing. Add HIEUNAV_KEYSTORE_BASE64, HIEUNAV_STORE_PASSWORD, HIEUNAV_KEY_ALIAS and HIEUNAV_KEY_PASSWORD in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$HIEUNAV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hieunav-release.jks"
          echo "HIEUNAV_KEYSTORE_PATH=$RUNNER_TEMP/hieunav-release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HieuNav-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
