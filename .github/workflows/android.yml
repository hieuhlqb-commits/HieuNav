
name: Build HieuNav APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      HIEUNAV_KEYSTORE_BASE64: ${{ secrets.HIEUNAV_KEYSTORE_BASE64 }}
      HIEUNAV_STORE_PASSWORD: ${{ secrets.HIEUNAV_STORE_PASSWORD }}
      HIEUNAV_KEY_ALIAS: ${{ secrets.HIEUNAV_KEY_ALIAS }}
      HIEUNAV_KEY_PASSWORD: ${{ secrets.HIEUNAV_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare and validate persistent signing key
        shell: bash
        run: |
          set -euo pipefail

          for name in HIEUNAV_KEYSTORE_BASE64 HIEUNAV_STORE_PASSWORD HIEUNAV_KEY_ALIAS HIEUNAV_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

          KEYSTORE="$RUNNER_TEMP/hieunav-release.jks"

          printf '%s' "$HIEUNAV_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          echo "Keystore size:"
          wc -c < "$KEYSTORE"

          echo "Keystore SHA256:"
          ACTUAL_SHA=$(sha256sum "$KEYSTORE" | awk '{print $1}')
          echo "$ACTUAL_SHA"

          EXPECTED_SHA="5fe4576072b9c60d51bccab8a1a946a32c34eae571db355f710cf1776049f6b1"

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Keystore SHA256 mismatch. Check GitHub Secret."
            exit 1
          fi

          if [ "$(wc -c < "$KEYSTORE")" -ne 2666 ]; then
            echo "::error::Keystore size mismatch."
            exit 1
          fi

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$HIEUNAV_STORE_PASSWORD" \
            -alias "$HIEUNAV_KEY_ALIAS"

          echo "HIEUNAV_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Persistent HieuNav signing key is valid."

      - name: Build signed APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HieuNav-signed-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
